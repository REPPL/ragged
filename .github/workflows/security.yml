name: Security

# v0.5.7 HIGH-6: Automated dependency vulnerability scanning
# Runs weekly and on security-related changes to detect CVEs early

on:
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'requirements*.txt'
  schedule:
    # Run every Monday at 9:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Allow manual triggers

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run pip-audit
        id: pip-audit
        run: |
          pip install pip-audit
          pip-audit --desc --format json > pip-audit-report.json || true
          pip-audit --desc
        continue-on-error: true

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v5
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 90

      - name: Check for critical vulnerabilities
        run: |
          pip install jq
          # Fail if critical vulnerabilities found
          CRITICAL=$(jq -r '.vulnerabilities | length' pip-audit-report.json || echo "0")
          echo "Found $CRITICAL vulnerabilities"

          if [ "$CRITICAL" -gt "0" ]; then
            echo "::warning::Found $CRITICAL dependency vulnerabilities"
            # Don't fail on vulnerabilities yet, just warn
            # TODO: Enable after addressing existing vulnerabilities
            # exit 1
          fi

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('pip-audit-report.json', 'utf8'));
            const vulns = report.vulnerabilities || [];

            let comment = `## 🔒 Security Scan Results\n\n`;

            if (vulns.length === 0) {
              comment += `✅ No known vulnerabilities found in dependencies.\n`;
            } else {
              comment += `⚠️ Found ${vulns.length} known vulnerabilities:\n\n`;
              comment += `| Package | Version | Vulnerability | Fix Available |\n`;
              comment += `|---------|---------|---------------|---------------|\n`;

              for (const vuln of vulns.slice(0, 10)) {  // Limit to 10
                const pkg = vuln.name || 'Unknown';
                const ver = vuln.version || 'Unknown';
                const id = vuln.id || 'N/A';
                const fix = vuln.fix_versions || 'No fix';
                comment += `| ${pkg} | ${ver} | ${id} | ${fix} |\n`;
              }

              if (vulns.length > 10) {
                comment += `\n_...and ${vulns.length - 10} more. See full report in artifacts._\n`;
              }
            }

            comment += `\n[Full report available in workflow artifacts](${context.payload.repository.html_url}/actions/runs/${context.runId})\n`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
