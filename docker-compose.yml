services:
  # FastAPI backend
  ragged-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragged-api
    ports:
      - "${RAGGED_API_PORT:-8000}:8000"  # FastAPI default port
    volumes:
      - ./src:/app/src:ro  # Source code (read-only for safety)
      - ./docs:/app/docs:ro  # Documentation (read-only)
      - ./data:/app/data  # Runtime data (read-write)
      - ./tests:/app/tests:ro  # Tests (read-only)
    environment:
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - CHROMA_URL=${CHROMA_URL:-http://chromadb:8001}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED:-1}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - PYTHONPATH=/app  # Ensure Python can find the ragged package
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ragged-network
    restart: unless-stopped
    # Create symlink then start uvicorn - allows 'ragged' imports to find /app/src
    command: ["sh", "-c", "ln -sfn /app/src /app/ragged && python -m uvicorn ragged.web.api:app --host 0.0.0.0 --port 8000 --reload"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Gradio web UI
  ragged-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragged-ui
    ports:
      - "${RAGGED_UI_PORT:-7860}:7860"  # Gradio default port
    volumes:
      - ./src:/app/src:ro  # Source code (read-only for safety)
      - ./data:/app/data  # Runtime data (read-write)
    environment:
      - RAGGED_API_URL=${RAGGED_API_URL:-http://ragged-api:8000}
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED:-1}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - PYTHONPATH=/app  # Ensure Python can find the ragged package
    depends_on:
      ragged-api:
        condition: service_healthy
    networks:
      - ragged-network
    restart: unless-stopped
    # Create symlink then start gradio - allows 'ragged' imports to find /app/src
    command: ["sh", "-c", "ln -sfn /app/src /app/ragged && python -m ragged.web.gradio_ui"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ChromaDB vector database
  chromadb:
    image: chromadb/chroma:0.5.0
    container_name: ragged-chromadb
    ports:
      - "${CHROMA_PORT:-8001}:8000"  # ChromaDB default port (mapped to 8001 to avoid conflict)
    volumes:
      - chroma-data:/chroma/chroma  # Persistent vector storage
    environment:
      - IS_PERSISTENT=${IS_PERSISTENT:-TRUE}
      - ANONYMIZED_TELEMETRY=${ANONYMIZED_TELEMETRY:-FALSE}
    networks:
      - ragged-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/8000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis session store (v0.6.2 SECURITY-003)
  redis:
    image: redis:7-alpine
    container_name: ragged-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data  # Persistent session storage
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - ragged-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  ragged-network:
    driver: bridge

volumes:
  chroma-data:
    name: ragged-chroma-data
  redis-data:
    name: ragged-redis-data
